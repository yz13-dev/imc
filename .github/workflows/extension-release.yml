name: Extension Release

# Tags must be created from main (see CLAUDE.md).
on:
  push:
    tags:
      - "imc-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches extension version
        working-directory: apps/extension
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#imc-v}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ($TAG_VERSION) doesn't match apps/extension/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build & zip
        working-directory: apps/extension
        run: |
          bun run zip
          bun run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Extension ${{ github.ref_name }}"
          files: apps/extension/.output/extension-*.zip
          generate_release_notes: true
